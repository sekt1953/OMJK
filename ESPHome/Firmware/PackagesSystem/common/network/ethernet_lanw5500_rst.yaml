################################################################################
# Example configuration entry for SPI chips (ESP32)
################################################################################
# Common Network - Ethernet W5500
################################################################################
# Source: 
#   - https://esphome.io/components/ethernet/
#   - https://esphome.io/components/ethernet/#spi-configuration-variables
#   - Wiring the W5500 to ESP32-S3
#       - https://mischianti.org/integrating-w5500-with-esp32-using-core-3-native-ethernet-protocol-support-with-ssl-and-other-features/
#   - Wired networking, PoE, and a self-powered web camera
#       - Seeed Studio XIAO ESP32-S3: https://dronebotworkshop.com/esp32-ethernet/
# ------------------------------------------------------------------------------
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include 
#     file: common/network/ethernet_lanw5500_rst.yaml
#     vars:
#       ethernet_lanw5500_clk_pin: GPIO12
#       ethernet_lanw5500_mosi_pin: GPIO11
#       ethernet_lanw5500_miso_pin: GPIO13
#       ethernet_lanw5500_cs_pin: GPIO10
#       ethernet_lanw5500_interrupt_pin: GPIO9
#       ethernet_lanw5500_reset_pin: GPIO3
################################################################################
# Author: Svenn-Erik K. Thomsen
# YouTube: https://www.youtube.com/@sekt1953
# Version: 1.0.0
# Licence: CCO 1.0 https://creativecommons.org/publicdomain/zero/1.0/
################################################################################
# Notes:
#     - ikke Tested OK
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
################################################################################
ethernet:
  type: W5500
  mosi_pin: ${w5500_mosi}
  miso_pin: ${w5500_miso}
  clk_pin: ${w5500_clk}
  cs_pin: ${w5500_cs}
  interrupt_pin: ${w5500_int}
  reset_pin: ${5500_rst}
  