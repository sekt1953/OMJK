#     file: common/network/ethernet_ip101.yaml
#
#   Olimex ESP32-P4
#     vars:
#       ethernet_ip101_mdc_pin: GPIO31
#       ethernet_ip101_mdio_pin: GPIO52
#       ethernet_ip101_clk_pin: GPIO50
#       ethernet_ip101_power_pin: GPIO51
