################################################################################
ethernet:
  type: IP101
  mdc_pin: ${ethernet_ip101_mdc_pin}
  mdio_pin: ${ethernet_ip101_mdio_pin}
  power_pin: ${ethernet_ip101_power_pin}
  clk:
    mode: CLK_EXT_IN
    pin: ${ethernet_ip101_clk_pin}
  phy_addr: 1
  