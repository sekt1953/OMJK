# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
################################################################################
ethernet:
  type: LAN8720
  mdc_pin: GPIOXX     ${ethernet_lan8720_mdc_pin}
  mdio_pin: GPIOXX    ${ethernet_lan8720_mdio_pin}
  clk:
    pin: GPIO17       ${ethernet_lan8720_clk_pin}
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12   ${ethernet_lan8720_power_pin}
