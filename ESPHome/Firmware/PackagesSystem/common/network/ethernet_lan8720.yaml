#   - https://esphome.io/components/ethernet/
#   - https://esphome.io/components/ethernet/#rmii-configuration-variables
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include 
#     file: common/network/ethernet_lan8720.yaml
#     vars:
#       ethernet_lan8720_mdc_pin: GPIO23
#       ethernet_lan8720_mdio_pin: GPIO18
#       ethernet_lan8720_clk_pin: GPIO17
#       ethernet_lan8720_power_pin: GPIO12
#
